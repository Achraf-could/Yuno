 <label>${T('sfx')}<input type="range" min="0" max="100" value="${sfxV*100}" style="width:100%" oninput="sfxV=this.value/100;SFX.click()"></label>`+btn(T('free')+': '+(freeCtl?'ON':'OFF'),"freeCtl=!freeCtl;show('set')")+btn(T('back'),"show('menu')"));
 if(n=='info')h=win(T('info'),`<div>${T('infoT')}</div><div style="opacity:.85;font-size:12px">${T('ctrl')}</div>`+btn(T('back'),"show('menu')"));
 if(n=='exit'){h=win(T('exit'),`<div>${T('bye')}</div>`+btn(T('back'),"show('menu')"));try{window.close()}catch(e){}}
 if(n=='ships')h=win(T('shipsT'),'<div class="grid2">'+SHIP_NAMES.map((s,i)=>{const p=SPEC[i],bar=(l,v)=>`<div class="r"><span>${T(l)}</span><div class="bar2"><i style="width:${Math.round(v*100)}%"></i></div></div>`;return`<div class="sc${i==shipType?' sel':''}" onclick="SFX.click();shipType=${i};show('ships')"><img src="${shipImg(i)}"><b>${s}</b>${bar('sSp',p.sp/1.5)+bar('sAr',p.hm/120)+bar('sDm',p.dm/42)+bar('sBl',p.bs/230)+bar('sHd',p.tr/4.5)}<small>${T('d'+i)}</small></div>`}).join('')+'</div>'+btn(T('back'),"show('menu')"));
 if(n=='stages')h=win(T('stages'),STAGES.map((s,i)=>btn(T('stage')+' '+(i+1)+(i<unlocked?'':' 🔒')+' · 🤖'+s.b+' · ☄'+s.a,i<unlocked?'stg='+i+";start('s')":'SFX.click()')).join('')+btn(T('back'),"show('menu')"));
 if(n=='rooms')h=win(T('roomsT'),ROOMS.map((r,i)=>btn(`${T('room')} ${r[0]} · ☄ ${r[1]}`,`room=${i};show('lobby')`)).join('')+btn(T('back'),"show('menu')"));
 if(n=='lobby')h=win(T('room')+' '+ROOMS[room][0],CFG.map((c,i)=>`<div class="row"><b>P${i+1}</b>${btn(T(c.t=='off'?'off':c.t),`CFG[${i}].t={human:'bot',bot:'off',off:'human'}[CFG[${i}].t];show('lobby')`)}${btn(SHIP_NAMES[c.s||0],`CFG[${i}].s=((CFG[${i}].s||0)+1)%6;show('lobby')`)}<div class="sw" style="background:#${COLS[c.c].toString(16).padStart(6,'0')}" onclick="CFG[${i}].c=(CFG[${i}].c+1)%10;show('lobby')"></div></div>`).join('')+btn(T('start'),"CFG.filter(c=>c.t!='off').length<2?alert(T('need')):start('m')")+btn(T('back'),"show('rooms')"));
 if(n=='end')h=win(T('title'),`<div style="font-size:20px;text-align:center">${msg}</div>`+(single&&won&&stg<STAGES.length-1?btn(T('next'),"stg++;start('s')"):'')+btn(T('again'),single?"start('s')":"start('m')")+btn(T('menu'),"toMenu()"));
 $('scr').innerHTML=h;$('scr').style.display='flex'}
show('menu');
</script></body></html>
