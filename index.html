
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Space Survival 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#030817;color:white;font-family:Arial}
canvas{display:block}
#menu{
position:fixed;inset:0;z-index:5;
display:flex;align-items:center;justify-content:center;
background:radial-gradient(#102b55,#020510);
}
.panel{text-align:center;width:90%;max-width:380px;padding:25px;
background:#10264add;border:1px solid #55caff;border-radius:18px}
h1{color:#63dfff;text-shadow:0 0 15px #00aaff}
button{border:0;border-radius:10px;padding:13px 22px;
background:linear-gradient(#53dfff,#0879c9);color:white;
font-size:16px;font-weight:bold;margin:7px;cursor:pointer}
#hud{position:fixed;top:12px;left:12px;right:12px;
display:none;justify-content:space-between;pointer-events:none}
#controls{position:fixed;bottom:20px;left:15px;right:15px;
display:none;justify-content:space-between;align-items:end}
.pad{display:grid;grid-template-columns:55px 55px 55px;gap:5px}
.pad button{margin:0;padding:15px 0}
.actions{display:flex;flex-direction:column;gap:8px}
.actions button{margin:0}
</style>
</head>
<body>

<div id="menu">
<div class="panel">
<h1>🚀 Space Survival 3D</h1>
<p>استكشف الفضاء وحارب الكويكبات!</p>
<button onclick="startGame()">ابدأ اللعب</button>
<p>Designed by us_rxm</p>
</div>
</div>

<div id="hud">
<span>❤️ الصحة: <b id="hp">100</b></span>
<span>⭐ النقاط: <b id="score">0</b></span>
</div>

<div id="controls">
<div class="pad">
<button onclick="move('left')">⬅️</button>
<button onclick="move('up')">⬆️</button>
<button onclick="move('right')">➡️</button>
<button onclick="move('down')">⬇️</button>
</div>
<div class="actions">
<button onclick="shoot()">🔥 إطلاق</button>
<button onclick="boost()">🚀 سرعة</button>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let scene,camera,renderer,player;
let asteroids=[],bullets=[];
let score=0,hp=100,running=false;
let speed=0.5;

function init(){
scene=new THREE.Scene();
scene.background=new THREE.Color(0x030817);
scene.fog=new THREE.Fog(0x030817,40,180);

camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,500);
camera.position.set(0,7,13);
camera.lookAt(0,0,0);

renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,1.5));

let light=new THREE.PointLight(0x55bbff,3,100);
light.position.set(0,10,10);
scene.add(light);

let starsGeo=new THREE.BufferGeometry();
let positions=[];
for(let i=0;i<1500;i++){
positions.push((Math.random()-.5)*250,
(Math.random()-.5)*150,
-Math.random()*250);
}
starsGeo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
scene.add(new THREE.Points(starsGeo,new THREE.PointsMaterial({color:0xffffff,size:.5})));

let geometry=new THREE.ConeGeometry(.8,2.5,8);
geometry.rotateX(Math.PI/2);
player=new THREE.Mesh(geometry,new THREE.MeshStandardMaterial({
color:0x00ccff,metalness:.5,roughness:.3
}));
player.position.set(0,0,0);
scene.add(player);

for(let i=0;i<18;i++)createAsteroid();
}

function createAsteroid(){
let mesh=new THREE.Mesh(
new THREE.IcosahedronGeometry(.6+Math.random()*1.2,1),
new THREE.MeshStandardMaterial({color:0x777788,roughness:1})
);
mesh.position.set((Math.random()-.5)*35,
(Math.random()-.5)*18,-30-Math.random()*100);
scene.add(mesh);
asteroids.push(mesh);
}

function startGame(){
if(!renderer)init();
score=0;hp=100;
running=true;
document.getElementById('menu').style.display='none';
document.getElementById('hud').style.display='flex';
document.getElementById('controls').style.display='flex';
animate();
}

function move(dir){
if(!running)return;
if(dir==='left')player.position.x-=1;
if(dir==='right')player.position.x+=1;
if(dir==='up')player.position.y+=1;
if(dir==='down')player.position.y-=1;
player.position.x=Math.max(-12,Math.min(12,player.position.x));
player.position.y=Math.max(-7,Math.min(7,player.position.y));
}

function shoot(){
if(!running)return;
let b=new THREE.Mesh(
new THREE.SphereGeometry(.18,8,8),
new THREE.MeshBasicMaterial({color:0x00ffff})
);
b.position.copy(player.position);
b.position.z-=2;
scene.add(b);bullets.push(b);
}

function boost(){speed=1.5;setTimeout(()=>speed=.5,1500)}

function animate(){
if(!running)return;
requestAnimationFrame(animate);

asteroids.forEach((a)=>{
a.position.z+=speed;
a.rotation.x+=.01;
a.rotation.y+=.02;

if(a.position.z>8){
a.position.z=-80-Math.random()*80;
a.position.x=(Math.random()-.5)*35;
a.position.y=(Math.random()-.5)*18;
score+=10;
}

if(a.position.distanceTo(player.position)<1.5){
hp-=1;
a.position.z=-100;
if(hp<=0)endGame();
}
});

bullets.forEach((b,i)=>{
b.position.z-=2;
if(b.position.z<-120){
scene.remove(b);bullets.splice(i,1);return;
}
asteroids.forEach(a=>{
if(b.position.distanceTo(a.position)<1.5){
a.position.z=-100;
scene.remove(b);
bullets.splice(i,1);
score+=20;
}
});
});

camera.position.x+=(player.position.x-camera.position.x)*.05;
camera.position.y+=(player.position.y+7-camera.position.y)*.05;
camera.lookAt(player.position.x,player.position.y,player.position.z-10);

document.getElementById('hp').textContent=Math.max(0,hp);
document.getElementById('score').textContent=score;
renderer.render(scene,camera);
}

function endGame(){
running=false;
document.getElementById('menu').style.display='flex';
document.getElementById('menu').innerHTML=
'<div class="panel"><h1>انتهت اللعبة!</h1><p>نقاطك: '+score+
'</p><button onclick="location.reload()">العب مجدداً</button></div>';
}

addEventListener('keydown',e=>{
if(e.key==='ArrowLeft'||e.key==='a')move('left');
if(e.key==='ArrowRight'||e.key==='d')move('right');
if(e.key==='ArrowUp'||e.key==='w')move('up');
if(e.key==='ArrowDown'||e.key==='s')move('down');
if(e.code==='Space')shoot();
});

addEventListener('resize',()=>{
if(!renderer)return;
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
